name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          META_PIXEL_ID: ${{ secrets.META_PIXEL_ID }}
          GTM_CONTAINER_ID: ${{ secrets.GTM_CONTAINER_ID }}
          PUBLIC_GTM_CONTAINER_ID: ${{ secrets.PUBLIC_GTM_CONTAINER_ID }}
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          PUBLIC_GA4_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA4_MEASUREMENT_ID }}
          PUBLIC_TIKTOK_PIXEL_ID: ${{ secrets.PUBLIC_TIKTOK_PIXEL_ID || 'D8FTG3RC77UANKFS989G' }}
        run: npm run build

      - name: Sync Cloudflare Pages runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIUU_MODE: ${{ secrets.FIUU_MODE }}
          FIUU_MERCHANT_ID: ${{ secrets.FIUU_MERCHANT_ID }}
          FIUU_VERIFY_KEY: ${{ secrets.FIUU_VERIFY_KEY }}
          FIUU_SECRET_KEY: ${{ secrets.FIUU_SECRET_KEY }}
          FIUU_PAYMENT_BASE_URL: ${{ secrets.FIUU_PAYMENT_BASE_URL }}
          FIUU_IPN_ACK_URL: ${{ secrets.FIUU_IPN_ACK_URL }}
          FIUU_EXTENDED_VCODE: ${{ secrets.FIUU_EXTENDED_VCODE }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_WORKSPACE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_WORKSPACE_OAUTH_REFRESH_TOKEN }}
          GMAIL_FROM_EMAIL: ${{ secrets.GMAIL_FROM_EMAIL }}
          SELLER_NOTIFICATION_EMAIL: ${{ secrets.SELLER_NOTIFICATION_EMAIL }}
          SELLER_NOTIFICATION_CC: ${{ secrets.SELLER_NOTIFICATION_CC }}
          SALES_NOTIFICATION_CC: ${{ secrets.SALES_NOTIFICATION_CC }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          META_PIXEL_ID: ${{ secrets.META_PIXEL_ID }}
          GTM_CONTAINER_ID: ${{ secrets.GTM_CONTAINER_ID }}
          PUBLIC_GTM_CONTAINER_ID: ${{ secrets.PUBLIC_GTM_CONTAINER_ID }}
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          PUBLIC_GA4_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA4_MEASUREMENT_ID }}
          PUBLIC_TIKTOK_PIXEL_ID: ${{ secrets.PUBLIC_TIKTOK_PIXEL_ID || 'D8FTG3RC77UANKFS989G' }}
        run: |
          set -euo pipefail

          put_secret() {
            local name="$1"
            local value="${!name:-}"

            if [ -z "$value" ]; then
              echo "::warning::Skipping empty GitHub secret: $name"
              return 0
            fi

            printf '%s\n' "$value" | npx --yes wrangler@4 pages secret put "$name" --project-name=lt-ornis-security-safe
          }

          for name in \
            FIUU_MODE \
            FIUU_MERCHANT_ID \
            FIUU_VERIFY_KEY \
            FIUU_SECRET_KEY \
            FIUU_PAYMENT_BASE_URL \
            FIUU_IPN_ACK_URL \
            FIUU_EXTENDED_VCODE \
            GOOGLE_SHEET_ID \
            GOOGLE_OAUTH_CLIENT_ID \
            GOOGLE_OAUTH_CLIENT_SECRET \
            GOOGLE_WORKSPACE_OAUTH_REFRESH_TOKEN \
            GMAIL_FROM_EMAIL \
            SELLER_NOTIFICATION_EMAIL \
            SELLER_NOTIFICATION_CC \
            SALES_NOTIFICATION_CC \
            RESEND_API_KEY \
            RESEND_FROM_EMAIL \
            META_PIXEL_ID \
            GTM_CONTAINER_ID \
            PUBLIC_GTM_CONTAINER_ID \
            GA4_MEASUREMENT_ID \
            PUBLIC_GA4_MEASUREMENT_ID \
            PUBLIC_TIKTOK_PIXEL_ID
          do
            put_secret "$name"
          done

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=lt-ornis-security-safe --branch=main

    <line x1="186" y1="835" x2="186" y2="855" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="186" y1="855" x2="199" y2="866" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text x="241" y="866" fill="#080808" font-size="34" font-weight="850">VALID FOR</text>

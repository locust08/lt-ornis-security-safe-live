<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1086" role="img" aria-labelledby="title desc">
  <title id="title">Ornis 45 percent off limited time popup</title>
  <desc id="desc">Limited time only. Up to 45 percent off premium security with code ORNIS45, valid for 3 days only.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf6"/>
      <stop offset="0.55" stop-color="#f7eee7"/>
      <stop offset="1" stop-color="#eadfd4"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="9%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="22" flood-color="#34281f" flood-opacity="0.14"/>
    </filter>
    <filter id="textSoft" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="1" flood-color="#4b1d25" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1450" height="1086" rx="54" fill="url(#bg)"/>
  <rect width="1450" height="1086" rx="54" fill="url(#glow)"/>
  <path d="M0 644 C245 598 405 640 628 610 C900 573 1110 610 1450 560 L1450 1086 L0 1086 Z" fill="#ead7c8" opacity="0.32"/>
  <path d="M0 687 C265 652 431 681 655 650 C919 613 1111 650 1450 610 L1450 1086 L0 1086 Z" fill="#f9efe6" opacity="0.68"/>

  <g fill="#78313c" filter="url(#textSoft)">

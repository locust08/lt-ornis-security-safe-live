    <text x="155" y="747" fill="#080808" font-size="31" font-weight="850" letter-spacing="1">USE CODE</text>
    <text x="378" y="756" fill="#78313c" font-size="55" font-weight="950" letter-spacing="2">ORNIS45</text>


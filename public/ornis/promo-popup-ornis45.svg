    <rect x="610" y="164" width="44" height="2.5" rx="1.25"/>
    <text x="213" y="179" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="800" letter-spacing="6">LIMITED TIME ONLY</text>

    <text x="132" y="263" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800">Up to</text>
    <text x="106" y="509" font-family="Inter, Arial, sans-serif" font-size="330" font-weight="950" letter-spacing="-13">45</text>
    <text x="506" y="417" font-family="Inter, Arial, sans-serif" font-size="151" font-weight="950">%</text>
    <text x="515" y="512" font-family="Inter, Arial, sans-serif" font-size="80" font-weight="950" letter-spacing="1">OFF</text>

    <rect x="689" y="256" width="7" height="39" rx="3.5" transform="rotate(18 692.5 275.5)" opacity="0.92"/>
    <rect x="720" y="284" width="7" height="45" rx="3.5" transform="rotate(52 723.5 306.5)" opacity="0.8"/>
    <rect x="747" y="337" width="7" height="38" rx="3.5" transform="rotate(82 750.5 356)" opacity="0.82"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="154" y="587" fill="#080808" font-size="51" font-weight="700">Premium Security,</text>
    <text x="154" y="644" fill="#080808" font-size="51" font-weight="700">Now More Accessible</text>

    <rect x="115" y="681" width="548" height="108" rx="17" fill="#fff8f1" fill-opacity="0.28" stroke="#78313c" stroke-width="2.5"/>
